org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Flutter defaults shrink=true, which turns on R8 minify for release.
# That was stripping AdMob/Firebase ContentProvider classes and killing
# the process on open (instant close, no Dart UI). Keep rules live in
# app/proguard-rules.pro for when shrink is re-enabled; leave it off
# for the sideloaded GitHub release APKs until those rules are proven.
shrink=false
