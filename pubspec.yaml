name: splitwize
description: Split bills with friends — Firebase backend, Google Sign-In, push notifications.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.0.0
  currency_picker: ^2.0.21
  firebase_storage: ^12.3.6
  google_sign_in: ^6.2.1
  # Receipt photos: pick from gallery/camera, compress before upload
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Offline-first local data + cost-saving sync
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.0
  uuid: ^4.5.1
  # Skeleton loading placeholders (shimmer effect)
  shimmer: ^4.0.0
  purchases_flutter: ^10.17.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod: ^3.0.0
  # Runs the real SQLite layer on the desktop test VM.
  sqflite_common_ffi: ^2.3.4
  # Firebase core mocks for the functional-test harness.
  firebase_core_platform_interface: ^6.0.3
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.0
  # Launcher icon generation (run after the android/ios folders exist)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  # Deterministic launcher backgrounds and splash sizing from the shared artwork.
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# assets/icon/app_icon.png is the single source for all native branding.
# Prepare derivatives with: dart run tool/generate_splash_assets.dart
# Then generate platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/launcher_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#013A27"
  adaptive_icon_background: "#013A27"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 8

# The native launch screen stays visible until Flutter's first frame.
# main() already completes Firebase startup before runApp(), so no runtime
# preserve/remove calls or artificial startup delay are needed.
# One consistent native launch appearance in every system theme.
# The green provides a consistent background for the transparent app icon.
# Keep the icon centered, with no extra text.
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#013A27"
  color_dark: "#013A27"
  image: assets/splash/splash_icon.png
  image_dark: assets/splash/splash_icon.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: false
  android_12:
    color: "#013A27"
    color_dark: "#013A27"
    image: assets/splash/splash_android12.png
    image_dark: assets/splash/splash_android12.png
