name: Apply user-selected Splitwize app icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-selected-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download user-approved icon source
        run: |
          curl --fail --location --retry 3 --output assets/icon/app_icon.png "https://at.adobe.com/llGfUcPxdRa1qKHy"
          echo '0c9056651cf13c0cd569720b08049c21d482185a61ad3ba242282ff799b692c5  assets/icon/app_icon.png' | sha256sum --check
          file assets/icon/app_icon.png
          python -m pip install 'Pillow>=10,<13'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('assets/icon')
          # Keep app_icon.png exactly byte-for-byte as the user's uploaded PNG.
          original=Image.open(root/'app_icon.png')
          original.load()
          if original.format != 'PNG' or original.size != (1254,1254):
              raise RuntimeError('Uploaded icon has unexpected format or dimensions')
          # Android adaptive icons are layered and system-masked; generate
          # derivatives without altering the exact master asset.
          rgba=original.convert('RGBA')
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          artwork=rgba.resize((850,850),Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork,(87,87))
          foreground.save(root/'adaptive_foreground.png', optimize=True)
          Image.new('RGB',(1024,1024),(3,68,39)).save(root/'adaptive_background.png')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: |
          dart run tool/generate_splash_assets.dart
          dart run flutter_native_splash:create
      - run: |
          flutter analyze
          flutter test
      - name: Commit generated icon and splash assets
        run: |
          git add assets/icon/ assets/splash/ android/app/src/main/res/ ios/Runner/Assets.xcassets/ ios/Runner/Base.lproj/LaunchScreen.storyboard ios/Runner/Info.plist
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply exact uploaded Splitwize icon to Android and iOS'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
