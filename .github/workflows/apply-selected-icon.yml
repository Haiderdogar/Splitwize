name: Apply user-selected Splitwize app icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-selected-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare native branding from the repository app_icon.png
        run: dart run tool/generate_splash_assets.dart
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: |
          flutter analyze
          flutter test
      - name: Commit generated icon and splash assets
        run: |
          git add assets/icon/ assets/splash/ android/app/src/main/res/ ios/Runner/Assets.xcassets/ ios/Runner/Base.lproj/LaunchScreen.storyboard ios/Runner/Info.plist
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply exact uploaded Splitwize icon to Android and iOS'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
